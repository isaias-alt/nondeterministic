name: Publish posts

# Flips `draft: true` to `draft: false` on main for every post that is due.
# A post is due when its pubDate is in the past, or is today and it is already
# 09:30 or later in America/Asuncion. Announcements go out at 10:30, so the
# post has to be live before that.
#
# After publishing, main is merged back into develop, so `git pull` locally.
# Then the Vercel deploy hook is called (secret VERCEL_DEPLOY_HOOK) so the
# deploy does not depend on the Git integration reacting, and the job waits for
# the post to answer 200 on the live site, failing (and emailing) if it never does.
#
# Triggers: a push to main (publishes anything already due, never early),
# a retried schedule between 09:30 and 10:20 America/Asuncion, and a manual run.
# GitHub cron is best effort and can start late or skip a run, so it fires
# every 10 minutes instead of once. The job is idempotent: once a post is
# published, later runs find nothing to do. If a post is still a due draft at
# the end, the job fails so GitHub emails the failure.
#
# Paraguay is on permanent UTC-3, so 09:30 Asuncion = 12:30 UTC.
# Scheduled workflows only run from the default branch (develop), so this file
# must exist there too, but it only ever edits main.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30,40,50 12 * * *"
    - cron: "0,10,20 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Flip due drafts to published
        id: publish
        run: |
          today=$(TZ=America/Asuncion date +%F)
          now=$(TZ=America/Asuncion date +%H%M)

          # pubDate, today, HHMM -> due when the date passed, or it is today and 09:30+.
          is_due() {
            [[ "$1" < "$2" ]] || { [[ "$1" == "$2" ]] && (( 10#$3 >= 930 )); }
          }

          pub_date() {
            sed -n 's/^pubDate: *"\{0,1\}\([0-9-]\{10\}\).*/\1/p' "$1" | head -1
          }

          posts() {
            find src/content/posts \( -name 'index.md' -o -name 'index.mdx' \)
          }

          published=()
          while IFS= read -r file; do
            grep -q '^draft: true' "$file" || continue
            pub=$(pub_date "$file")
            [ -n "$pub" ] || { echo "No pubDate in $file, skipping"; continue; }
            if is_due "$pub" "$today" "$now"; then
              sed -i 's/^draft: true/draft: false/' "$file"
              published+=("$file")
            else
              echo "Not due yet: $file ($pub, now $today $now Asuncion)"
            fi
          done < <(posts)

          if [ ${#published[@]} -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "publish: ${published[*]}"
            git push origin main

            # Bring the publish commit back to develop so a local pull gets it.
            # A conflict fails the job (and the email) instead of being forced.
            git checkout -B develop origin/develop
            git merge --no-edit main
            git push origin develop
            git checkout main
            echo "files=${published[*]}" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to publish (now $today $now Asuncion)."
          fi

          # Fail loudly if a due post is still a draft.
          missed=0
          while IFS= read -r file; do
            grep -q '^draft: true' "$file" || continue
            pub=$(pub_date "$file")
            [ -n "$pub" ] || continue
            if is_due "$pub" "$today" "$now"; then
              echo "::error file=$file::Due post is still a draft ($pub)"
              missed=1
            fi
          done < <(posts)
          exit $missed

      - name: Deploy and verify the post is live
        if: ${{ !cancelled() && steps.publish.outputs.files != '' }}
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          FILES: ${{ steps.publish.outputs.files }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null \
              && echo "Deploy hook called." \
              || echo "::error::The Vercel deploy hook call failed"
          else
            echo "::warning::VERCEL_DEPLOY_HOOK is not set, relying on the Git integration to deploy"
          fi

          site=https://blog.lucasco.dev
          failed=0
          for file in $FILES; do
            dir=$(dirname "$file")
            slug=$(basename "$dir")
            urls=("$site/$slug/")
            if [ -f "$dir/index.es.md" ] || [ -f "$dir/index.es.mdx" ]; then
              urls+=("$site/es/$slug/")
            fi
            for url in "${urls[@]}"; do
              live=0
              for _ in $(seq 1 60); do
                code=$(curl -s -o /dev/null -w '%{http_code}' "$url?check=$RANDOM")
                if [ "$code" = 200 ]; then live=1; break; fi
                sleep 10
              done
              if [ "$live" = 1 ]; then
                echo "Live: $url"
              else
                echo "::error::Not live after 10 minutes: $url (last status $code)"
                failed=1
              fi
            done
          done
          exit $failed
