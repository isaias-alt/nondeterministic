name: Publish "The Dependency You Never Declared"

# One-off: 2026-10-12 10:00 America/Asuncion (UTC-3) = 13:00 UTC.
# Scheduled workflows only run from the default branch (develop), so this
# file lives there, but it edits main and then syncs the change back.
# Safe to delete after the post is live.
on:
  schedule:
    - cron: "0 13 12 10 *"
  workflow_dispatch:

permissions:
  contents: write

env:
  POST: src/content/posts/_standalone/dependency-you-never-declared/index.md

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Flip draft to false on main
        id: flip
        run: |
          if ! grep -q '^draft: true' "$POST"; then
            echo "Post is already published, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i 's/^draft: true/draft: false/' "$POST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "publish: The Dependency You Never Declared"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Sync main back into develop
        if: steps.flip.outputs.changed == 'true'
        run: |
          git fetch origin develop
          git checkout develop
          git merge --no-edit main
          git push origin develop
