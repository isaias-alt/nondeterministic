<svg viewBox="0 0 680 530" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace">
  <rect x="0" y="0" width="680" height="530" rx="10" fill="#141C24" />

  <defs>
    <marker id="arrowStructure" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9FB8CE" />
    </marker>
    <marker id="arrowMint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4EC8A0" />
    </marker>
  </defs>

  <!-- microtask queue -->
  <text font-weight="300" x="100" y="46" font-size="13" fill="#C9D67B">microtask queue</text>
  <text font-weight="300" x="600" y="46" text-anchor="end" font-size="10" fill="#C9D67B" opacity="0.65">promises</text>

  <line x1="20" y1="108" x2="58" y2="108" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowStructure)" />

  <rect x="60" y="58" width="560" height="100" rx="10" fill="none" stroke="#C9D67B" stroke-width="1" />

  <rect x="140" y="84" width="70" height="44" rx="8" fill="none" stroke="#C9D67B" stroke-width="1" />
  <text font-weight="300" x="175" y="106" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#C9D67B">.then()</text>

  <rect x="305" y="84" width="70" height="44" rx="8" fill="none" stroke="#C9D67B" stroke-width="1" />
  <text font-weight="300" x="340" y="106" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#C9D67B">.then()</text>

  <rect x="470" y="84" width="70" height="44" rx="8" fill="none" stroke="#C9D67B" stroke-width="1" />
  <text font-weight="300" x="505" y="106" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#C9D67B">await</text>

  <circle cx="210" cy="84" r="11" fill="#141C24" stroke="#4EC8A0" stroke-width="2" />
  <text font-weight="300" x="210" y="84" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#4EC8A0">1</text>

  <circle cx="375" cy="84" r="11" fill="#141C24" stroke="#4EC8A0" stroke-width="2" />
  <text font-weight="300" x="375" y="84" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#4EC8A0">2</text>

  <circle cx="540" cy="84" r="11" fill="#141C24" stroke="#4EC8A0" stroke-width="2" />
  <text font-weight="300" x="540" y="84" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#4EC8A0">3</text>

  <!-- event loop, in the gap between the two queues -->
  <line x1="310" y1="208" x2="310" y2="160" stroke="#4EC8A0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 5" marker-end="url(#arrowMint)" />
  <line x1="370" y1="248" x2="370" y2="296" stroke="#4EC8A0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 5" marker-end="url(#arrowMint)" />

  <rect x="270" y="208" width="140" height="40" rx="10" fill="none" stroke="#4EC8A0" stroke-width="1" />
  <text font-weight="300" x="340" y="228" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#4EC8A0">event loop</text>
  <text font-weight="300" x="420" y="232" font-size="10" fill="#4EC8A0" opacity="0.8">drains all, then next</text>

  <!-- macrotask queue -->
  <text font-weight="300" x="100" y="286" font-size="13" fill="#E0A45C">macrotask queue</text>
  <text font-weight="300" x="600" y="286" text-anchor="end" font-size="10" fill="#E0A45C" opacity="0.65">timers, I/O, callbacks</text>

  <line x1="20" y1="348" x2="58" y2="348" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowStructure)" />

  <rect x="60" y="298" width="560" height="100" rx="10" fill="none" stroke="#E0A45C" stroke-width="1" />

  <rect x="140" y="324" width="110" height="44" rx="8" fill="none" stroke="#E0A45C" stroke-width="1" />
  <text font-weight="300" x="195" y="346" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#E0A45C">setTimeout</text>

  <rect x="305" y="324" width="255" height="44" rx="8" fill="none" stroke="#E0A45C" stroke-width="1" stroke-dasharray="4 5" opacity="0.55" />
  <text font-weight="300" x="432" y="346" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#E0A45C" opacity="0.7">I/O, fetch cb, ...</text>

  <circle cx="250" cy="324" r="11" fill="#141C24" stroke="#4EC8A0" stroke-width="2" />
  <text font-weight="300" x="250" y="324" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#4EC8A0">4</text>

  <!-- legend -->
  <line x1="60" y1="475" x2="100" y2="475" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowStructure)" />
  <text font-weight="300" x="112" y="479" font-size="11" fill="#9FB8CE">queued</text>

  <line x1="60" y1="500" x2="100" y2="500" stroke="#4EC8A0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 6" />
  <text font-weight="300" x="112" y="504" font-size="11" fill="#4EC8A0">event loop touches</text>
</svg>
