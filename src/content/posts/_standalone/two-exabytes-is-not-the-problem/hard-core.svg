<svg viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace">
  <rect x="0" y="0" width="680" height="460" rx="10" fill="#141C24" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9FB8CE" />
    </marker>
  </defs>

  <text font-weight="300" x="40" y="36" font-size="12" fill="#9FB8CE">where the copy machine stops</text>

  <!-- static layer -->
  <rect x="40" y="78" width="140" height="56" rx="10" fill="none" stroke="#C9D67B" stroke-width="1" />
  <text font-weight="300" x="110" y="106" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#C9D67B">same file</text>

  <line x1="180" y1="106" x2="230" y2="106" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" />
  <line x1="180" y1="106" x2="310" y2="106" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" />
  <line x1="180" y1="106" x2="390" y2="106" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" />

  <circle cx="250" cy="106" r="20" fill="none" stroke="#9FB8CE" stroke-width="1" />
  <circle cx="330" cy="106" r="20" fill="none" stroke="#9FB8CE" stroke-width="1" />
  <circle cx="410" cy="106" r="20" fill="none" stroke="#9FB8CE" stroke-width="1" />
  <text font-weight="300" x="480" y="110" font-size="11" fill="#9FB8CE">static - cacheable</text>

  <line x1="40" y1="170" x2="640" y2="170" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 10" />

  <!-- soft dependencies -->
  <rect x="40" y="210" width="140" height="44" rx="10" fill="none" stroke="#9FB8CE" stroke-width="1" />
  <text font-weight="300" x="110" y="232" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#9FB8CE">telemetry</text>

  <rect x="40" y="272" width="140" height="44" rx="10" fill="none" stroke="#9FB8CE" stroke-width="1" />
  <text font-weight="300" x="110" y="294" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#9FB8CE">news feed</text>

  <rect x="40" y="334" width="140" height="44" rx="10" fill="none" stroke="#9FB8CE" stroke-width="1" />
  <text font-weight="300" x="110" y="356" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#9FB8CE">friends</text>

  <line x1="180" y1="232" x2="250" y2="232" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 7" />
  <line x1="180" y1="294" x2="250" y2="294" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 7" />
  <line x1="180" y1="356" x2="250" y2="356" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 7" />
  <text font-weight="300" x="265" y="300" font-size="11" fill="#9FB8CE">can fail,</text>
  <text font-weight="300" x="265" y="318" font-size="11" fill="#9FB8CE">game still runs</text>

  <!-- hard core -->
  <rect x="380" y="225" width="240" height="120" rx="10" fill="none" stroke="#4EC8A0" stroke-width="1" />
  <text font-weight="300" x="500" y="258" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#E8E6E1">entitlement</text>
  <text font-weight="300" x="500" y="286" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#E8E6E1">login - purchase</text>
  <text font-weight="300" x="500" y="318" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#4EC8A0">source of truth</text>

  <text font-weight="300" x="40" y="430" font-size="12" fill="#E8E6E1">shrink the hard core</text>
</svg>
