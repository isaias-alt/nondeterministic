<svg viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace">
  <rect x="0" y="0" width="680" height="470" rx="10" fill="#141C24" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9FB8CE" />
    </marker>
    <marker id="arrow-lime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C9D67B" />
    </marker>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4EC8A0" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E0A45C" />
    </marker>
  </defs>

  <text font-weight="300" x="40" y="34" font-size="12" fill="#9FB8CE">router decides, bytes bypass</text>

  <!-- CDNs -->
  <rect x="40" y="55" width="130" height="50" rx="10" fill="none" stroke="#C9D67B" stroke-width="1" />
  <text font-weight="300" x="105" y="80" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#C9D67B">CDN A</text>

  <rect x="40" y="155" width="130" height="50" rx="10" fill="none" stroke="#4EC8A0" stroke-width="1" />
  <text font-weight="300" x="105" y="180" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#4EC8A0">CDN B: chunk n+1</text>

  <rect x="40" y="255" width="130" height="50" rx="10" fill="none" stroke="#9FB8CE" stroke-width="1" />
  <text font-weight="300" x="105" y="280" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#9FB8CE">CDN C</text>

  <!-- console -->
  <rect x="520" y="145" width="120" height="70" rx="10" fill="none" stroke="#9FB8CE" stroke-width="1" />
  <text font-weight="300" x="580" y="180" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#9FB8CE">console</text>

  <!-- chunk paths: solid = bytes -->
  <path d="M176,80 L470,80 L470,162 L514,162" fill="none" stroke="#C9D67B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-lime)" />
  <line x1="176" y1="180" x2="514" y2="180" stroke="#4EC8A0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-mint)" />
  <path d="M176,280 L470,280 L470,198 L514,198" fill="none" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  <!-- decision path: dashed = routing only -->
  <path d="M436,382 L560,382 L560,222" fill="none" stroke="#E0A45C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" marker-end="url(#arrow-amber)" />
  <text font-weight="300" x="446" y="372" font-size="11" fill="#E0A45C">where to go</text>

  <!-- router -->
  <rect x="250" y="350" width="180" height="64" rx="10" fill="none" stroke="#9FB8CE" stroke-width="1" />
  <text font-weight="300" x="340" y="374" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#9FB8CE">request router</text>
  <text font-weight="300" x="340" y="396" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#9FB8CE" opacity="0.8">no bytes pass through</text>

  <!-- legend -->
  <line x1="40" y1="445" x2="80" y2="445" stroke="#C9D67B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-lime)" />
  <text font-weight="300" x="92" y="449" font-size="11" fill="#C9D67B">chunks</text>
  <line x1="210" y1="445" x2="250" y2="445" stroke="#E0A45C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#arrow-amber)" />
  <text font-weight="300" x="262" y="449" font-size="11" fill="#E0A45C">routing decision</text>
</svg>
