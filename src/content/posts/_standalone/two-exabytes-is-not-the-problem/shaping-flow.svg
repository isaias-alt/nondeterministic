<svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace">
  <rect x="0" y="0" width="680" height="500" rx="10" fill="#141C24" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9FB8CE" />
    </marker>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4EC8A0" />
    </marker>
  </defs>

  <!-- panel A: when -->
  <text font-weight="300" x="40" y="38" font-size="12" fill="#9FB8CE">when - spread the arrivals</text>
  <line x1="60" y1="225" x2="630" y2="225" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" />

  <path d="M70,210 C110,205 130,70 180,65 C225,62 245,170 300,205" fill="none" stroke="#4EC8A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text font-weight="300" x="188" y="62" font-size="11" fill="#4EC8A0">one instant</text>

  <path d="M70,210 C160,190 220,130 340,125 C460,120 540,175 620,208" fill="none" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text font-weight="300" x="420" y="112" font-size="11" fill="#9FB8CE">pre-load - by region</text>

  <line x1="40" y1="250" x2="640" y2="250" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 10" />

  <!-- panel B: what -->
  <text font-weight="300" x="40" y="284" font-size="12" fill="#9FB8CE">what - critical bytes first</text>

  <rect x="40" y="350" width="120" height="60" rx="10" fill="none" stroke="#9FB8CE" stroke-width="1" />
  <text font-weight="300" x="100" y="380" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#9FB8CE">200 GB</text>

  <line x1="166" y1="380" x2="214" y2="380" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" />
  <text font-weight="300" x="190" y="368" text-anchor="middle" font-size="10" fill="#9FB8CE">ceiling</text>

  <rect x="220" y="345" width="130" height="70" rx="10" fill="none" stroke="#E0A45C" stroke-width="1" />
  <text font-weight="300" x="285" y="380" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#E0A45C">critical files</text>

  <line x1="356" y1="380" x2="414" y2="380" stroke="#4EC8A0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-mint)" />

  <rect x="420" y="350" width="160" height="60" rx="10" fill="none" stroke="#4EC8A0" stroke-width="1" />
  <text font-weight="300" x="500" y="380" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#4EC8A0">playable at 30%</text>

  <path d="M285,421 L285,455 L500,455 L500,416" fill="none" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" marker-end="url(#arrow)" />
  <text font-weight="300" x="385" y="475" text-anchor="middle" font-size="11" fill="#9FB8CE">rest, throttled harder</text>

  <text font-weight="300" x="40" y="475" font-size="11" fill="#E8E6E1">same bytes. different order.</text>
</svg>
