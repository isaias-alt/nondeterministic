<svg viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace">
  <rect x="0" y="0" width="680" height="430" rx="10" fill="#141C24" />

  <text font-weight="300" x="40" y="42" font-size="12" fill="#9FB8CE">same total, different arrival</text>

  <!-- axes -->
  <line x1="60" y1="370" x2="630" y2="370" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" />
  <line x1="60" y1="370" x2="60" y2="70" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" />
  <text font-weight="300" x="60" y="62" font-size="11" fill="#9FB8CE">rate (Tbps)</text>
  <text font-weight="300" x="630" y="360" text-anchor="end" font-size="10" fill="#9FB8CE">launch day</text>

  <!-- x ticks -->
  <text font-weight="300" x="60" y="388" text-anchor="start" font-size="10" fill="#9FB8CE">0h</text>
  <text font-weight="300" x="155" y="388" text-anchor="middle" font-size="10" fill="#9FB8CE">4h</text>
  <text font-weight="300" x="345" y="388" text-anchor="middle" font-size="10" fill="#9FB8CE">12h</text>
  <text font-weight="300" x="630" y="388" text-anchor="end" font-size="10" fill="#9FB8CE">24h</text>

  <!-- even spread -->
  <line x1="60" y1="273" x2="630" y2="273" stroke="#9FB8CE" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7" />
  <text font-weight="300" x="470" y="261" text-anchor="middle" font-size="10" fill="#9FB8CE">even spread: 2.1 EB / 24 h &#8776; 194 Tbps</text>

  <!-- Akamai 2025 peak -->
  <line x1="60" y1="172" x2="630" y2="172" stroke="#E0A45C" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 8" />
  <text font-weight="300" x="420" y="162" text-anchor="middle" font-size="11" fill="#E0A45C">Akamai 2025 peak, whole network &#8776; 396 Tbps</text>

  <!-- front-loaded curve -->
  <path d="M60,350 C75,345 82,338 90,330 C105,315 112,252 120,215 C132,155 142,96 155,78.5 C168,96 180,135 195,164 C215,192 230,218 250,240 C280,265 315,280 350,290 C390,302 440,320 480,330 C520,340 580,346 630,350" fill="none" stroke="#4EC8A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="155" cy="78.5" r="4" fill="#141C24" stroke="#4EC8A0" stroke-width="2" />
  <text font-weight="300" x="195" y="98" font-size="11" fill="#4EC8A0">front-loaded peak &#8776; 583 Tbps</text>

  <text font-weight="300" x="60" y="415" font-size="12" fill="#E8E6E1">the area is the same. the shape is not.</text>
</svg>
