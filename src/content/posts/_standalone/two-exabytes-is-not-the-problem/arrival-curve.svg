<svg viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace">
  <rect x="0" y="0" width="680" height="430" rx="10" fill="#141C24" />

  <text font-weight="300" x="40" y="42" font-size="12" fill="#9FB8CE">same total, different arrival</text>

  <!-- axes -->
  <line x1="60" y1="370" x2="630" y2="370" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" />
  <line x1="60" y1="370" x2="60" y2="70" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" />
  <text font-weight="300" x="44" y="72" text-anchor="end" font-size="11" fill="#9FB8CE">rate</text>
  <text font-weight="300" x="630" y="394" text-anchor="end" font-size="11" fill="#9FB8CE">launch day</text>

  <!-- even spread -->
  <line x1="60" y1="270" x2="630" y2="270" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 7" />
  <text font-weight="300" x="340" y="252" font-size="10" fill="#9FB8CE">2 EB / 24 h ~ 23 TB/s</text>

  <!-- one CDN ceiling -->
  <line x1="60" y1="160" x2="630" y2="160" stroke="#E0A45C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8" />
  <text font-weight="300" x="480" y="150" font-size="11" fill="#E0A45C">one CDN ceiling</text>

  <!-- front-loaded curve -->
  <path d="M60,340 C95,335 120,120 175,95 C215,78 240,190 300,255 C380,330 490,358 630,365" fill="none" stroke="#4EC8A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="175" cy="95" r="4" fill="#141C24" stroke="#4EC8A0" stroke-width="2" />
  <text font-weight="300" x="191" y="88" font-size="11" fill="#4EC8A0">front-loaded peak ~ 555 Tbps</text>

  <text font-weight="300" x="60" y="415" font-size="12" fill="#E8E6E1">the area is the same. the shape is not.</text>
</svg>
