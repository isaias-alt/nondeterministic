<svg viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace">
  <rect x="0" y="0" width="680" height="430" rx="10" fill="#141C24" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9FB8CE" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E0A45C" />
    </marker>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4EC8A0" />
    </marker>
  </defs>

  <text font-weight="300" x="40" y="36" font-size="12" fill="#9FB8CE">queues store the peak</text>

  <!-- arrivals -->
  <text font-weight="300" x="60" y="100" font-size="11" fill="#E0A45C">15.000 / s</text>
  <line x1="66" y1="125" x2="194" y2="125" stroke="#E0A45C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-amber)" />
  <line x1="66" y1="155" x2="194" y2="155" stroke="#E0A45C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-amber)" />
  <line x1="66" y1="185" x2="194" y2="185" stroke="#E0A45C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-amber)" />

  <!-- queue -->
  <rect x="200" y="100" width="210" height="200" rx="10" fill="none" stroke="#9FB8CE" stroke-width="1" />
  <line x1="220" y1="140" x2="390" y2="140" stroke="#9FB8CE" stroke-width="1" stroke-linecap="round" />
  <line x1="220" y1="165" x2="390" y2="165" stroke="#9FB8CE" stroke-width="1" stroke-linecap="round" />
  <line x1="220" y1="190" x2="390" y2="190" stroke="#9FB8CE" stroke-width="1" stroke-linecap="round" />
  <line x1="220" y1="215" x2="390" y2="215" stroke="#9FB8CE" stroke-width="1" stroke-linecap="round" />
  <line x1="220" y1="240" x2="390" y2="240" stroke="#9FB8CE" stroke-width="1" stroke-linecap="round" />
  <text font-weight="300" x="305" y="280" text-anchor="middle" font-size="11" fill="#9FB8CE">waiting</text>

  <!-- service -->
  <line x1="416" y1="195" x2="474" y2="195" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" />
  <rect x="480" y="160" width="150" height="70" rx="10" fill="none" stroke="#C9D67B" stroke-width="1" />
  <text font-weight="300" x="555" y="186" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#C9D67B">10.000 / s</text>
  <text font-weight="300" x="555" y="210" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#C9D67B">service</text>

  <!-- backpressure valve -->
  <path d="M555,236 L555,360 L125,360 L125,200" fill="none" stroke="#4EC8A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" marker-end="url(#arrow-mint)" />
  <text font-weight="300" x="340" y="392" text-anchor="middle" font-size="11" fill="#4EC8A0">backpressure - Retry-After, jitter</text>

  <text font-weight="300" x="40" y="415" font-size="12" fill="#E8E6E1">the queue is the buffer. backpressure is the valve.</text>
</svg>
