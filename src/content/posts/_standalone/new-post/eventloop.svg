<svg viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace">
  <rect x="0" y="0" width="680" height="640" rx="10" fill="#141C24" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9FB8CE" />
    </marker>
  </defs>

  <!-- boundary: language / runtime -->
  <text x="165" y="50" text-anchor="middle" font-size="12" fill="#9FB8CE" opacity="0.7">language</text>
  <text x="530" y="50" text-anchor="middle" font-size="12" fill="#9FB8CE" opacity="0.7">runtime</text>

  <line x1="350" y1="62" x2="350" y2="120" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 10" />
  <line x1="350" y1="170" x2="350" y2="235" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 10" />

  <rect x="60" y="110" width="210" height="70" rx="10" fill="none" stroke="#C9D67B" stroke-width="1.75" />
  <text x="165" y="150" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#C9D67B">your code, one thread</text>

  <rect x="430" y="70" width="200" height="40" rx="8" fill="none" stroke="#E0A45C" stroke-width="1.75" />
  <text x="530" y="90" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#E0A45C">fetch</text>

  <rect x="430" y="125" width="200" height="40" rx="8" fill="none" stroke="#E0A45C" stroke-width="1.75" />
  <text x="530" y="145" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#E0A45C">setTimeout</text>

  <rect x="430" y="180" width="200" height="40" rx="8" fill="none" stroke="#E0A45C" stroke-width="1.75" />
  <text x="530" y="200" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#E0A45C">the DOM</text>

  <line x1="280" y1="145" x2="418" y2="145" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" />
  <text x="350" y="135" text-anchor="middle" font-size="11" fill="#9FB8CE">you call out</text>

  <!-- queue: finished work falls and waits -->
  <line x1="530" y1="220" x2="530" y2="268" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" />
  <text x="546" y="248" font-size="11" fill="#9FB8CE">drops in</text>

  <rect x="180" y="270" width="380" height="60" rx="10" fill="none" stroke="#9FB8CE" stroke-width="1.75" />
  <text x="370" y="300" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#9FB8CE">callback queue</text>

  <!-- thread + event loop -->
  <path d="M250,330 L250,380 L165,380 L165,428" fill="none" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  <rect x="60" y="430" width="210" height="70" rx="10" fill="none" stroke="#C9D67B" stroke-width="1.75" />
  <text x="165" y="458" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#C9D67B">one thread,</text>
  <text x="165" y="476" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#C9D67B">one thing at a time</text>

  <rect x="530" y="390" width="100" height="70" rx="10" fill="none" stroke="#4EC8A0" stroke-width="1.75" />
  <text x="580" y="430" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#4EC8A0">event loop</text>
  <text x="580" y="468" text-anchor="middle" font-size="10" fill="#4EC8A0" opacity="0.75">checks, lets in</text>

  <line x1="530" y1="440" x2="272" y2="460" stroke="#4EC8A0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 7" />
  <circle cx="530" cy="440" r="3" fill="#141C24" stroke="#4EC8A0" stroke-width="2" />

  <line x1="562" y1="390" x2="510" y2="332" stroke="#4EC8A0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 7" />
  <circle cx="562" cy="390" r="3" fill="#141C24" stroke="#4EC8A0" stroke-width="2" />

  <!-- legend -->
  <line x1="60" y1="575" x2="100" y2="575" stroke="#9FB8CE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" />
  <text x="112" y="579" font-size="11" fill="#9FB8CE">flow</text>

  <line x1="60" y1="600" x2="100" y2="600" stroke="#4EC8A0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 7" />
  <text x="112" y="604" font-size="11" fill="#4EC8A0">observes</text>
</svg>
